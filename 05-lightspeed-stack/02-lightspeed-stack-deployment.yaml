apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-stack
  namespace: lightspeed-poc
  labels:
    app: lightspeed-stack
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightspeed-stack
      component: api
  template:
    metadata:
      labels:
        app: lightspeed-stack
        component: api
    spec:
      containers:
        - name: lightspeed-stack-container
          image: quay.io/admiller/lsc:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: HOME
              value: /app-root
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key-secret
                  key: key
            - name: VLLM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key-secret
                  key: key
            - name: INFERENCE_MODEL
              value: ibm-granite/granite-3.3-2b-instruct
            - name: KV_STORE_PATH
              value: /app-root/.llama/storage/rag/kv_store.db
            - name: SQL_STORE_PATH
              value: /app-root/.llama/storage/sql_store.db
            - name: HF_HOME
              value: /app-root/hf-cache
            - name: TRANSFORMERS_CACHE
              value: /app-root/hf-cache
          volumeMounts:
            - name: config
              mountPath: /app-root/lightspeed-stack.yaml
              subPath: lightspeed-stack.yaml
            - name: config
              mountPath: /app-root/run.yaml
              subPath: run.yaml
            - name: feedback-storage
              mountPath: /tmp/data/feedback
            - name: transcripts-storage
              mountPath: /tmp/data/transcripts
            - name: llama-storage
              mountPath: /app-root/.llama
            - name: hf-cache
              mountPath: /app-root/hf-cache
          resources:
            requests:
              memory: "4Gi"
              cpu: "1500m"
            limits:
              memory: "8Gi"
              cpu: "3"
          startupProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: lightspeed-stack-config
        - name: feedback-storage
          emptyDir: {}
        - name: transcripts-storage
          emptyDir: {}
        - name: llama-storage
          emptyDir: {}
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lightspeed-stack-service
  namespace: lightspeed-poc
  labels:
    app: lightspeed-stack
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: lightspeed-stack
    component: api
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lightspeed-stack
  namespace: lightspeed-poc
  labels:
    app: lightspeed-stack
  annotations:
    haproxy.router.openshift.io/timeout: 90s
spec:
  to:
    kind: Service
    name: lightspeed-stack-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
