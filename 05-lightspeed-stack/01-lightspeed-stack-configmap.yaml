apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-stack-config
  namespace: lightspeed-poc
data:
  lightspeed-stack.yaml: |
    name: Lightspeed Core Service - ROSA POC
    service:
      host: 0.0.0.0
      port: 8080
      auth_enabled: false
      workers: 1
      color_log: true
      access_log: true
      cors:
        allow_origins:
          - "*"
        allow_credentials: false
        allow_methods:
          - "*"
        allow_headers:
          - "*"

    llama_stack:
      use_as_library_client: true
      library_client_config_path: /app-root/run.yaml

    inference:
      default_model: ibm-granite/granite-3.3-2b-instruct
      default_provider: vllm

    mcp_servers:
      - name: "rhoai-mcp"
        url: "http://rhoai-mcp.lightspeed-poc.svc.cluster.local:8000/sse"

    user_data_collection:
      feedback_enabled: true
      feedback_storage: "/tmp/data/feedback"
      transcripts_enabled: true
      transcripts_storage: "/tmp/data/transcripts"

    authentication:
      module: "noop"

    customization:
      system_prompt: |
        You are a helpful AI assistant with expertise in Red Hat OpenShift AI.
        You have access to a knowledge_search tool that contains documentation about Red Hat OpenShift AI.

        IMPORTANT INSTRUCTIONS:
        1. When users ask questions about Red Hat OpenShift AI, RHOAI, model serving, inference, or related topics,
           ALWAYS use the knowledge_search tool to find accurate information from the documentation.
        2. DO NOT explain that you will use the tool - just use it silently.
        3. After the tool returns results, synthesize the information into a clear, comprehensive answer.
        4. Your final response should be the answer itself, not a description of what you're doing.

        If the knowledge base doesn't contain relevant information, you can answer based on your general knowledge,
        but make it clear that the information is not from the official documentation.

        Be helpful, accurate, and concise in your responses.

  run.yaml: |
    version: 2
    image_name: lightspeed-poc-llama-stack

    apis:
    - agents
    - batches
    - datasetio
    - eval
    - files
    - inference
    - safety
    - scoring
    - tool_runtime
    - vector_io

    benchmarks: []
    conversations_store:
      db_path: /app-root/.llama/storage/conversations.db
      type: sqlite
    datasets: []

    inference_store:
      db_path: /app-root/.llama/storage/inference-store.db
      type: sqlite
    metadata_store:
      db_path: /app-root/.llama/storage/registry.db
      type: sqlite

    providers:
      inference:
      # vLLM provider pointing to the vLLM service
      - provider_id: vllm
        provider_type: remote::vllm
        config:
          # Using hardcoded base_url (some vLLM providers expect this field name)
          base_url: http://vllm-llama-model-predictor.lightspeed-poc.svc.cluster.local:8080/v1
          url: http://vllm-llama-model-predictor.lightspeed-poc.svc.cluster.local:8080/v1
          api_token: ${env.VLLM_API_KEY}
          tls_verify: false
          max_tokens: 4096

      # Sentence transformers for embeddings (used for RAG)
      - config: {}
        provider_id: sentence-transformers
        provider_type: inline::sentence-transformers

      files:
      - config:
          metadata_store:
            table_name: files_metadata
            backend: sql_default
          storage_dir: /app-root/.llama/storage/files
        provider_id: meta-reference-files
        provider_type: inline::localfs

      scoring:
      - config: {}
        provider_id: basic
        provider_type: inline::basic

      tool_runtime:
      - config: {}
        provider_id: rag-runtime
        provider_type: inline::rag-runtime
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol

      vector_io:
      - config:
          persistence:
            namespace: vector_io::faiss
            backend: kv_default
        provider_id: faiss
        provider_type: inline::faiss

      agents:
      - config:
          persistence:
            agent_state:
              namespace: agents_state
              backend: kv_default
            responses:
              table_name: agents_responses
              backend: sql_default
        provider_id: meta-reference
        provider_type: inline::meta-reference

      batches:
      - config:
          kvstore:
            namespace: batches_store
            backend: kv_default
        provider_id: reference
        provider_type: inline::reference

      datasetio:
      - config:
          kvstore:
            namespace: huggingface_datasetio
            backend: kv_default
        provider_id: huggingface
        provider_type: remote::huggingface
      - config:
          kvstore:
            namespace: localfs_datasetio
            backend: kv_default
        provider_id: localfs
        provider_type: inline::localfs

      eval:
      - config:
          kvstore:
            namespace: eval_store
            backend: kv_default
        provider_id: meta-reference
        provider_type: inline::meta-reference

    scoring_fns: []
    server:
      port: 8321

    storage:
      backends:
        kv_default:
          type: kv_sqlite
          db_path: ${env.KV_STORE_PATH:=/app-root/.llama/storage/rag/kv_store.db}
        sql_default:
          type: sql_sqlite
          db_path: ${env.SQL_STORE_PATH:=/app-root/.llama/storage/sql_store.db}
      stores:
        metadata:
          namespace: registry
          backend: kv_default
        inference:
          table_name: inference_store
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
        conversations:
          table_name: openai_conversations
          backend: sql_default
        prompts:
          namespace: prompts
          backend: kv_default

    registered_resources:
      models:
      # vLLM model for inference
      - model_id: ${env.INFERENCE_MODEL}
        provider_id: vllm
        model_type: llm
        provider_model_id: ${env.INFERENCE_MODEL}

      # Embedding model for RAG
      - model_id: nomic-ai/nomic-embed-text-v1.5
        provider_id: sentence-transformers
        model_type: embedding
        provider_model_id: nomic-ai/nomic-embed-text-v1.5
        metadata:
          embedding_dimension: 768

      shields: []

      datasets: []
      scoring_fns: []
      benchmarks: []

      tool_groups:
      - toolgroup_id: builtin::rag
        provider_id: rag-runtime

      vector_dbs:
      - vector_db_id: rhoai-docs
        provider_id: faiss
        embedding_model: nomic-ai/nomic-embed-text-v1.5
        embedding_dimension: 768

    # Vector store configuration for RAG
    vector_stores:
      default_provider_id: faiss
      default_embedding_model:
        provider_id: sentence-transformers
        model_id: nomic-ai/nomic-embed-text-v1.5

    telemetry:
      enabled: true
